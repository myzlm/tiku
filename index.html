    <style>
        :root {
            --bg-deep: #08080f;
            --bg-card: rgba(18, 16, 28, 0.9);
            --bg-card-hover: rgba(22, 20, 34, 0.94);
            --gold: #d4a853;
            --gold-light: #f0d078;
            --gold-dark: #8b6914;
            --gold-soft: #c9a24e;
            --jade: #5a8f7b;
            --jade-light: #7ec8a0;
            --jade-dark: #3d6b5a;
            --ink: #c9b896;
            --ink-light: #e8dcc8;
            --ink-dim: #8a8068;
            --red-seal: #c23a2b;
            --red-seal-dark: #8b1f15;
            --neon-blue: #4da6ff;
            --neon-blue-dim: #2d7acc;
            --neon-purple: #a78bfa;
            --text: #d4c8b0;
            --text-dim: #8a8068;
            --text-muted: #5e5848;
            --border-gold: rgba(212, 168, 83, 0.35);
            --border-gold-hover: rgba(240, 208, 120, 0.6);
            --border-jade: rgba(90, 143, 123, 0.3);
            --shadow-gold: 0 0 20px rgba(212, 168, 83, 0.3);
            --shadow-gold-strong: 0 0 40px rgba(240, 208, 120, 0.45);
            --shadow-neon: 0 0 30px rgba(77, 166, 255, 0.25);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-elevated: 0 8px 40px rgba(0, 0, 0, 0.55);
            --font-cn: 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'KaiTi', 'PingFang SC', 'Microsoft YaHei', serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --radius-sm: 3px;
            --radius: 5px;
            --radius-lg: 10px;
            --radius-xl: 14px;
            --transition-fast: 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-slow: 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --page-padding: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.65;
        }

        body {
            font-family: var(--font-cn);
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
            scroll-behavior: smooth;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 12% 88%, rgba(90, 143, 123, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 88% 12%, rgba(212, 168, 83, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(77, 166, 255, 0.03) 0%, transparent 65%),
                radial-gradient(ellipse at 22% 22%, rgba(167, 139, 250, 0.04) 0%, transparent 48%);
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(180, 160, 120, 0.15) 2px, rgba(180, 160, 120, 0.15) 3px),
                repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(160, 140, 100, 0.1) 3px, rgba(160, 140, 100, 0.1) 4px);
        }
        .mountains-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.2;
            background: linear-gradient(175deg, transparent 35%, rgba(24, 22, 34, 0.85) 65%, rgba(16, 14, 24, 0.94) 100%);

        /* 登录 */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(10, 8, 20, 0.9) 0%, rgba(4, 3, 10, 0.96) 100%);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-gold);
            border-radius: var(--radius-xl);
            padding: 50px 42px;
            width: 450px;
            max-width: 92vw;
            text-align: center;
            box-shadow: var(--shadow-gold-strong), var(--shadow-elevated);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: cardGlow 4s ease-in-out infinite;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 2px solid rgba(194, 58, 43, 0.5);
            background: rgba(194, 58, 43, 0.08);
            box-shadow: 0 0 25px rgba(194, 58, 43, 0.3);
            pointer-events: none;
        }

        }
        .login-card .seal-icon { font-size: 58px; filter: drop-shadow(0 0 14px rgba(212,168,83,0.55)); animation: sealFloat 2.5s ease-in-out infinite; position: relative; z-index: 1; }

        .login-card .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; letter-spacing: 3px; position: relative; z-index: 1; }
        .login-card .input-group { margin-bottom: 15px; text-align: left; position: relative; z-index: 1; }
        .login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--ink-light); letter-spacing: 1px; }
        .login-card input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border-gold); border-radius: var(--radius); background: rgba(8,8,18,0.65); color: var(--ink-light); font-family: inherit; font-size: 15px; transition: var(--transition); letter-spacing: 1px; }
        .login-card input:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 22px rgba(240,208,120,0.35); background: rgba(10,10,22,0.8); }
        .login-card .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #6b4e0e 0%, #8b6914 25%, #b8942e 50%, #d4a853 75%, #8b6914 100%); color: #1a1608; border: 1px solid rgba(240,208,120,0.55); border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 4px; transition: var(--transition); position: relative; z-index: 1; font-family: inherit; }

        .login-card .btn-login:active { transform: scale(0.97); transition: 0.1s; }
        .login-card .error-msg { color: #e85d4a; font-size: 13px; margin-top: 14px; min-height: 20px; letter-spacing: 1px; position: relative; z-index: 1; }

        /* 主应用 */
        .app-container { display: none; max-width: 1400px; margin: 0 auto; padding: var(--page-padding); position: relative; z-index: 2; }
        .app-container.active { display: block; animation: fadeUpIn 0.5s ease-out; }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        .app-header {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
            margin-bottom: 22px; background: var(--bg-card); padding: 16px 26px; border-radius: var(--radius-lg);

        .app-header .brand .logo-icon { font-size: 30px; animation: sealFloat 3s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(212,168,83,0.5)); }
        .user-info-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        .badge-role.admin { background: rgba(212,168,83,0.15); color: var(--gold-light); border-color: rgba(212,168,83,0.4); }

        .btn { padding: 9px 18px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 1.5px; font-family: inherit; transition: var(--transition-fast); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; position: relative; overflow: hidden; }
        .btn:active { transform: scale(0.95); transition: 0.08s; }
        .btn-primary { background: linear-gradient(135deg, #5a3e0e, #8b6914 45%, #5a3e0e); color: #f0d078; border: 1px solid rgba(240,208,120,0.5); box-shadow: 0 2px 12px rgba(139,105,20,0.3); }
        .btn-primary:hover { box-shadow: 0 4px 22px rgba(240,208,120,0.45); filter: brightness(1.08); }

        .search-bar .view-toggle { display: flex; border: 1px solid var(--border-gold); border-radius: var(--radius); overflow: hidden; }

        .stats-bar { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 18px; background: rgba(18,16,28,0.6); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(8px); }

        .stat-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.1); align-self: center; }

        .questions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .questions-grid.list-view { grid-template-columns: 1fr; gap: 10px; }
        @media (max-width: 500px) { .questions-grid { grid-template-columns: 1fr; } }

        .question-card {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px 18px;
            transition: var(--transition); border: 1px solid var(--border-gold); position: relative;
            display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer; overflow: hidden;
            animation: cardIn 0.4s ease-out backwards;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .question-card:hover { border-color: var(--border-gold-hover); box-shadow: 0 0 32px rgba(240,208,120,0.18), 0 6px 30px rgba(0,0,0,0.45); transform: translateY(-4px); background: var(--bg-card-hover); }
        .question-card:active { transform: scale(0.985); transition: 0.1s; }
        .question-card .card-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .question-card .q-number { font-family: var(--font-mono); font-size: 11px; color: var(--gold-light); background: rgba(212,168,83,0.1); padding: 3px 11px; border-radius: 20px; border: 1px solid rgba(212,168,83,0.3); }
        .question-card .q-category { font-size: 11px; background: rgba(90,143,123,0.13); color: var(--jade-light); padding: 3px 11px; border-radius: 20px; border: 1px solid var(--border-jade); }
        .question-card .q-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .question-card .q-tag { font-size: 10px; background: rgba(167,139,250,0.1); color: #c4b5fd; padding: 2px 9px; border-radius: 15px; border: 1px solid rgba(167,139,250,0.25); cursor: pointer; transition: var(--transition-fast); }
        .question-card .q-tag:hover { background: rgba(167,139,250,0.22); border-color: rgba(167,139,250,0.5); color: #ddd0ff; }
        .question-card .q-name { font-size: 17px; font-weight: 700; color: var(--ink-light); letter-spacing: 1px; line-height: 1.4; }
        .card-images-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-images-row img { max-height: 70px; border-radius: 4px; border: 1px solid var(--border-gold); cursor: pointer; transition: var(--transition-fast); object-fit: cover; }
        .card-images-row img:hover { border-color: var(--gold-light); box-shadow: 0 0 14px rgba(212,168,83,0.35); transform: scale(1.04); }
        .card-actions { display: flex; gap: 7px; justify-content: flex-end; padding-top: 4px; }

    <script>
        (function() {
            const API = 'https://myzlm.serveousercontent.com';
            const PAGE_SIZE = 12;

            // ========== 粒子类（提前定义，修复初始化错误） ==========
            class Particle { /* 同修复后代码 */ }
            class SparkParticle { /* 同修复后代码 */ }

            const canvas = document.getElementById('particleCanvas'), ctx = canvas.getContext('2d');
            let particles = [], mouseParticles = [], particleCount = 80;

            function resizeCanvas() { /* ... 同前 */ }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function burstParticles(x,y) { /* ... */ }
            document.addEventListener('click', e => { /* ... */ });
            function animateParticles() { /* ... */ }
            animateParticles();

            // ========== 全局状态 ==========
            let allQuestions = [], allCategories = [], allTags = [];
            let currentUser = null, tempImages = [], currentTab = 'write', viewMode = 'grid', currentPage = 1, activeTagFilter = '';

            // ========== DOM引用（不变） ==========
            const $ = (sel) => document.querySelector(sel);
            // ... domRefs 定义

            // ========== 工具函数 ==========
            function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function escJs(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n'); }
            function showToast(msg, type='info') { /* ... */ }
            function renderMarkdown(text) { if(!text) return ''; try { return marked.parse(text,{breaks:true,gfm:true}); } catch(e) { return escHtml(text); } }
            async function renderMathMermaid(container) { /* ... */ }

            // ========== 认证逻辑 ==========
            async function checkAuth() { /* ... */ }
            function showLogin() { /* ... */ }
            function showApp() { /* ... */ }
            async function handleLogin() { /* ... */ }
            async function handleLogout() { /* ... */ }

            // ========== 数据加载（优化分类提取） ==========
            async function loadQuestions() {
                if (isLoading) return;
                isLoading = true;
                showSkeleton();
                try {
                    const r = await fetch(API + '/api/questions', { credentials: 'include' });
                    if (r.status === 401) { handleLogout(); isLoading = false; return; }
                    const d = await r.json();
                    allQuestions = (d.questions || []).map(q => ({
                        ...q,
                        tags: q.tags || (typeof q.tags === 'string' ? q.tags.split(/[,，]/).map(t => t.trim()).filter(Boolean) : []),
                        images: q.images || []
                    }));
                    // 优先使用后端返回的分类列表，若空则从题目中提取
                    allCategories = d.categories || [];
                    if (allCategories.length === 0 && allQuestions.length > 0) {
                        const catSet = new Set(allQuestions.map(q => q.category).filter(Boolean));
                        allCategories = Array.from(catSet).sort((a,b) => a.localeCompare(b));
                    } else {
                        allCategories.sort((a,b) => a.localeCompare(b));
                    }
                    // 提取所有标签
                    const tagSet = new Set();
                    allQuestions.forEach(q => (q.tags || []).forEach(t => tagSet.add(t)));
                    allTags = Array.from(tagSet).sort();
                    updateCategoryFilter();
                    renderQuestions();
                } catch (e) {
                    showToast('加载题目失败', 'error');
                    allQuestions = [];
                    renderQuestions();
                } finally { isLoading = false; }
            }

            function updateCategoryFilter() {
                const sel = domRefs.filterCategory;
                const cv = sel.value;
                sel.innerHTML = '<option value="">📂 万卷归宗</option>';
                allCategories.forEach(c => {
                    sel.innerHTML += `<option value="${escHtml(c)}" ${cv===c?'selected':''}>📂 ${escHtml(c)}</option>`;
                });
                domRefs.categoryList.innerHTML = allCategories.map(c => `<option value="${escHtml(c)}">`).join('');
            }

            // ========== 排序逻辑（先按分类字典序，再按题号） ==========
            function sortQuestions(list) {
                return list.sort((a, b) => {
                    const catA = (a.category || '').toLowerCase();
                    const catB = (b.category || '').toLowerCase();
                    if (catA !== catB) return catA.localeCompare(catB);
                    // 相同分类按题号字符串排序（支持数字+字母混合）
                    return (a.number || '').localeCompare(b.number || '');
                });
            }

            // ========== 渲染题目卡片（仅显示题号、分类、标题、标签、图片，无题面和代码） ==========
            function renderQuestions() {
                const filtered = getFilteredQuestions();
                const totalFiltered = filtered.length;
                const totalPages = Math.max(1, Math.ceil(totalFiltered / PAGE_SIZE));
                if (currentPage > totalPages) currentPage = totalPages;
                const startIdx = (currentPage - 1) * PAGE_SIZE;
                const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

                domRefs.statTotal.textContent = allQuestions.length;
                domRefs.statCategories.textContent = allCategories.length;
                domRefs.statPage.textContent = `${currentPage}/${totalPages}`;
                domRefs.resultCount.textContent = `共 ${totalFiltered} 卷`;
                updateTagFilterUI();

                const grid = domRefs.questionsGrid;
                const isAdmin = currentUser?.role === 'admin';

                if (!pageItems.length) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim);">📭 无匹配之卷</div>';
                    domRefs.pagination.innerHTML = '';
                    return;
                }

                grid.innerHTML = pageItems.map((q, idx) => {
                    const imgs = (q.images && q.images.length) ?
                        `<div class="card-images-row">${q.images.map(i=>`<img src="${escHtml(i)}" loading="lazy" onclick="event.stopPropagation();openLightbox('${escHtml(i)}')" alt="附图">`).join('')}</div>` : '';
                    const tagsHtml = (q.tags && q.tags.length) ?
                        `<div class="q-tags">${q.tags.map(t=>`<span class="q-tag" onclick="event.stopPropagation();filterByTag('${escJs(t)}')">#${escHtml(t)}</span>`).join('')}</div>` : '';
                    const actionBtns = isAdmin ?
                        `<div class="card-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-outline btn-xs" onclick="openEditor('${q.id}')">✏️ 修缮</button>
                            <button class="btn btn-danger btn-xs" onclick="deleteQuestion('${q.id}')">🗑 焚毁</button>
                        </div>` : '';

                    return `
                    <div class="question-card" onclick="openDetail('${q.id}')" style="animation-delay:${idx*0.03}s;">
                        <div class="card-header">
                            ${q.number ? `<span class="q-number">#${escHtml(q.number)}</span>` : ''}
                            ${q.category ? `<span class="q-category">📂 ${escHtml(q.category)}</span>` : ''}
                        </div>
                        <div class="q-name">${escHtml(q.name || '无名之题')}</div>
                        ${tagsHtml}
                        ${imgs}
                        ${actionBtns}
                    </div>`;
                }).join('');

                renderPagination(totalPages, totalFiltered);
                // 不再需要渲染 md-preview 的数学公式
            }

            function getFilteredQuestions() {
                let filtered = allQuestions;
                const kw = domRefs.searchKeyword.value.trim().toLowerCase();
                const cat = domRefs.filterCategory.value;
                if (activeTagFilter) filtered = filtered.filter(q => (q.tags||[]).includes(activeTagFilter));
                if (kw) {
                    filtered = filtered.filter(q =>
                        (q.number||'').toLowerCase().includes(kw) ||
                        (q.name||'').toLowerCase().includes(kw) ||
                        (q.content||'').toLowerCase().includes(kw) ||
                        (q.code||'').toLowerCase().includes(kw) ||
                        (q.category||'').toLowerCase().includes(kw) ||
                        (q.tags||[]).some(t => t.toLowerCase().includes(kw))
                    );
                }
                if (cat) filtered = filtered.filter(q => q.category === cat);
                // 应用新的排序规则
                return sortQuestions(filtered);
            }

            // 其余功能（详情、编辑、灯箱、键盘快捷键等）保持不变，但注意 openDetail 中需渲染完整内容
            // ... 完整代码请参考上一修复版本，仅修改了卡片渲染和排序逻辑

            // 暴露全局函数
            window.goToPage = goToPage;
            window.copyCodeDirect = function(code, btn) { copyToClipboard(code, btn); };
            window.filterByTag = filterByTag;
            window.openDetail = openDetail;
            window.closeDetail = closeDetail;
            window.openEditor = openEditor;
            window.closeEditor = closeEditor;
            window.switchTab = switchTab;
            window.uploadImages = uploadImages;
            window.addImgUrl = addImgUrl;
            window.removeImg = removeImg;
            window.saveQuestion = saveQuestion;
            window.deleteQuestion = deleteQuestion;
            window.openLightbox = openLightbox;
            window.closeLightbox = closeLightbox;
            window.handleLogout = handleLogout;
            window.setViewMode = setViewMode;
            window.onSearchInput = onSearchInput;
        })();
    </script>
</body>
</html>
