<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 墨韵题库 · 古风科技</title>

    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-style">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- KaTeX 数学公式 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <!-- Mermaid 图表 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <style>
        :root {
            --bg-deep: #08080f;
            --bg-card: rgba(18, 16, 28, 0.9);
            --bg-card-hover: rgba(22, 20, 34, 0.94);
            --gold: #d4a853;
            --gold-light: #f0d078;
            --gold-dark: #8b6914;
            --jade: #5a8f7b;
            --jade-light: #7ec8a0;
            --ink: #c9b896;
            --ink-light: #e8dcc8;
            --ink-dim: #8a8068;
            --red-seal: #c23a2b;
            --neon-blue: #4da6ff;
            --neon-purple: #a78bfa;
            --text: #d4c8b0;
            --text-dim: #8a8068;
            --border-gold: rgba(212, 168, 83, 0.35);
            --border-gold-hover: rgba(240, 208, 120, 0.6);
            --border-jade: rgba(90, 143, 123, 0.3);
            --shadow-gold: 0 0 20px rgba(212, 168, 83, 0.3);
            --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
            --font-cn: 'STSong','Songti SC','Noto Serif SC','SimSun','KaiTi','PingFang SC','Microsoft YaHei',serif;
            --font-mono: 'SF Mono','Fira Code','Cascadia Code','Consolas','Monaco',monospace;
            --radius-sm:3px; --radius:5px; --radius-lg:10px; --radius-xl:14px;
            --transition:0.3s cubic-bezier(0.25,0.46,0.45,0.94);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        #particleCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.55; }
        body {
            font-family:var(--font-cn); background:var(--bg-deep); color:var(--text);
            min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased;
            overflow-x:hidden; position:relative; scroll-behavior:smooth;
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background: radial-gradient(ellipse at 12% 88%, rgba(90,143,123,0.07) 0%, transparent 50%),
                        radial-gradient(ellipse at 88% 12%, rgba(212,168,83,0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(77,166,255,0.03) 0%, transparent 65%);
        }
        body::after {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.04;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(180,160,120,0.2) 2px, rgba(180,160,120,0.2) 3px),
                            repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(160,140,100,0.15) 3px, rgba(160,140,100,0.15) 4px);
        }
        .mountains-bg {
            position:fixed; bottom:0; left:0; width:100%; height:25vh; z-index:0; pointer-events:none; opacity:0.15;
            background:linear-gradient(175deg, transparent 35%, rgba(24,22,34,0.8) 65%, rgba(16,14,24,0.9) 100%);
        }

        /* 登录 */
        .login-overlay { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(10,8,20,0.9) 0%, rgba(4,3,10,0.96) 100%); transition:opacity 0.6s, visibility 0.6s; }
        .login-overlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .login-card { background:var(--bg-card); border:1.5px solid var(--border-gold); border-radius:var(--radius-xl); padding:50px 42px; width:450px; max-width:92vw; text-align:center; box-shadow:var(--shadow-gold); backdrop-filter:blur(24px); animation:cardGlow 4s ease-in-out infinite; position:relative; }
        .login-card::before { content:''; position:absolute; top:-36px; left:50%; transform:translateX(-50%); width:62px; height:62px; border-radius:50%; border:2px solid rgba(194,58,43,0.5); background:rgba(194,58,43,0.08); }
        @keyframes cardGlow { 0%,100%{ box-shadow:0 0 25px rgba(212,168,83,0.3),0 0 60px rgba(212,168,83,0.08); } 50%{ box-shadow:0 0 45px rgba(240,208,120,0.4),0 0 85px rgba(212,168,83,0.18); } }
        .login-card .seal-icon { font-size:58px; filter:drop-shadow(0 0 14px rgba(212,168,83,0.55)); animation:sealFloat 2.5s ease-in-out infinite; }
        @keyframes sealFloat { 0%,100%{ transform:translateY(0); } 35%{ transform:translateY(-10px); } 65%{ transform:translateY(-3px); } }
        .login-card h1 { font-size:27px; color:var(--gold-light); letter-spacing:5px; margin-bottom:2px; }
        .login-card .subtitle { font-size:13px; color:var(--text-dim); margin-bottom:30px; }
        .login-card .input-group { margin-bottom:15px; text-align:left; }
        .login-card label { font-size:13px; font-weight:600; margin-bottom:7px; color:var(--ink-light); }
        .login-card input { width:100%; padding:13px 16px; border:1.5px solid var(--border-gold); border-radius:var(--radius); background:rgba(8,8,18,0.65); color:var(--ink-light); font-size:15px; }
        .login-card input:focus { outline:none; border-color:var(--gold-light); }
        .login-card .btn-login { width:100%; padding:14px; background:linear-gradient(135deg, #6b4e0e, #8b6914 25%, #b8942e 50%, #d4a853 75%, #8b6914); color:#1a1608; border:1px solid rgba(240,208,120,0.55); border-radius:var(--radius); font-size:16px; font-weight:700; cursor:pointer; letter-spacing:4px; }
        .login-card .btn-login:hover { box-shadow:0 0 40px rgba(240,208,120,0.6); transform:translateY(-2px); }
        .login-card .error-msg { color:#e85d4a; font-size:13px; margin-top:14px; min-height:20px; }

        /* 主应用 */
        .app-container { display:none; max-width:1400px; margin:0 auto; padding:24px; position:relative; z-index:2; }
        .app-container.active { display:block; animation:fadeUpIn 0.5s ease-out; }
        @keyframes fadeUpIn { from{ opacity:0; transform:translateY(24px); } to{ opacity:1; transform:translateY(0); } }

        .app-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; background:var(--bg-card); padding:16px 26px; border-radius:var(--radius-lg); border:1px solid var(--border-gold); backdrop-filter:blur(16px); }
        .brand { display:flex; align-items:center; gap:10px; font-size:21px; font-weight:700; color:var(--gold-light); }
        .user-info-area { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .badge-role { font-size:12px; padding:5px 15px; border-radius:20px; border:1px solid; }
        .badge-role.owner { background:rgba(194,58,43,0.15); color:#ff8c7a; border-color:rgba(194,58,43,0.5); }
        .badge-role.admin { background:rgba(212,168,83,0.15); color:var(--gold-light); border-color:rgba(212,168,83,0.4); }
        .badge-role.member { background:rgba(90,143,123,0.15); color:var(--jade-light); border-color:var(--border-jade); }

        .btn { padding:9px 18px; border:none; border-radius:var(--radius); font-size:13px; font-weight:600; cursor:pointer; letter-spacing:1.5px; display:inline-flex; align-items:center; gap:6px; transition:var(--transition); }
        .btn:active { transform:scale(0.95); }
        .btn-primary { background:linear-gradient(135deg, #5a3e0e, #8b6914 45%, #5a3e0e); color:#f0d078; border:1px solid rgba(240,208,120,0.5); }
        .btn-outline { background:transparent; color:var(--gold-light); border:1.5px solid var(--border-gold); }
        .btn-outline:hover { border-color:var(--border-gold-hover); }
        .btn-danger { background:transparent; color:#e85d4a; border:1.5px solid rgba(200,60,40,0.5); }
        .btn-danger:hover { border-color:rgba(230,80,60,0.7); }
        .btn-sm { padding:5px 12px; font-size:11px; }
        .btn-xs { padding:3px 10px; font-size:10px; }

        .search-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
        .search-bar input, .search-bar select { padding:10px 15px; border:1.5px solid var(--border-gold); border-radius:var(--radius); font-size:13px; background:rgba(14,12,24,0.7); color:var(--ink-light); transition:var(--transition); }
        .search-bar input:focus, .search-bar select:focus { outline:none; border-color:var(--gold-light); }
        .search-bar input { flex:1; min-width:180px; }
        .search-bar select { min-width:140px; cursor:pointer; }

        .stats-bar { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; padding:10px 18px; background:rgba(18,16,28,0.6); border-radius:var(--radius); border:1px solid rgba(255,255,255,0.06); align-items:center; }
        .stat-item { font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
        .stat-value { color:var(--gold-light); font-weight:700; font-family:var(--font-mono); }

        /* ========== 3D 卡片舞台 ========== */
        .questions-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(420px,1fr));
            gap:16px;
            margin-bottom:20px;
            perspective: 1200px;
        }
        .questions-grid.list-view { grid-template-columns:1fr; gap:10px; }
        @media (max-width:500px) { .questions-grid { grid-template-columns:1fr; } }

        .question-card {
            background:var(--bg-card);
            border-radius:var(--radius-lg);
            padding:20px;
            border:1px solid var(--border-gold);
            display:flex;
            flex-direction:column;
            gap:10px;
            box-shadow:var(--shadow-card);
            backdrop-filter:blur(12px);
            cursor:pointer;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), 
                        box-shadow 0.4s ease,
                        border-color 0.4s;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* 卡片的立体光效层 */
        .question-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(212,168,83,0.15) 0%, transparent 50%, rgba(90,143,123,0.1) 100%);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.4s;
        }
        .question-card > * { position: relative; z-index: 1; }

        /* 悬停时的 3D 效果（JavaScript 动态控制具体数值） */
        .question-card:hover {
            border-color: var(--border-gold-hover);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 30px rgba(212,168,83,0.4);
        }

        .card-header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .q-number { font-family:var(--font-mono); font-size:11px; color:var(--gold-light); background:rgba(212,168,83,0.1); padding:3px 11px; border-radius:20px; border:1px solid rgba(212,168,83,0.3); }
        .q-category { font-size:11px; background:rgba(90,143,123,0.13); color:var(--jade-light); padding:3px 11px; border-radius:20px; border:1px solid var(--border-jade); }
        .q-tags { display:flex; gap:5px; flex-wrap:wrap; }
        .q-tag { font-size:10px; background:rgba(167,139,250,0.1); color:#c4b5fd; padding:2px 9px; border-radius:15px; border:1px solid rgba(167,139,250,0.25); cursor:pointer; transition:0.2s; }
        .q-tag.active { background:rgba(167,139,250,0.3); border-color:var(--neon-purple); color:#fff; }
        .q-name { font-size:17px; font-weight:700; color:var(--ink-light); }
        .card-images-row img { max-height:70px; border-radius:4px; border:1px solid var(--border-gold); cursor:pointer; object-fit:cover; }

        .pagination { display:flex; justify-content:center; gap:8px; padding:16px 0; flex-wrap:wrap; }
        .pagination button { padding:8px 15px; border:1px solid var(--border-gold); border-radius:var(--radius); background:rgba(14,12,24,0.6); color:var(--ink-light); cursor:pointer; }
        .pagination button.active { background:rgba(212,168,83,0.2); border-color:var(--gold-light); color:var(--gold-light); font-weight:700; }
        .pagination button:disabled { opacity:0.35; cursor:not-allowed; }

        /* 模态框 */
        .modal-overlay { position:fixed; inset:0; background:rgba(3,3,10,0.88); z-index:1000; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
        .modal-panel { background:var(--bg-card); border:1.5px solid var(--border-gold); border-radius:var(--radius-xl); width:780px; max-width:94vw; max-height:84vh; overflow-y:auto; padding:30px 26px; }
        .modal-panel h2 { color:var(--gold-light); margin-bottom:16px; }
        .modal-panel input[type="text"], .modal-panel textarea, .modal-panel select { width:100%; padding:10px; background:rgba(10,10,20,0.6); border:1px solid var(--border-gold); color:var(--ink-light); border-radius:var(--radius); font-family:inherit; }
        .modal-panel textarea { font-family:var(--font-mono); resize:vertical; }
        .detail-code pre { background:#0a0c15; padding:16px; border-radius:6px; border:1px solid rgba(77,166,255,0.3); overflow-x:auto; position:relative; }
        .copy-detail-btn { position:absolute; top:8px; right:12px; background:rgba(77,166,255,0.2); color:#8cc8ff; border:none; padding:4px 14px; border-radius:4px; cursor:pointer; }

        .toast { position:fixed; top:20px; right:20px; z-index:9999; padding:12px 22px; border-radius:var(--radius); color:#fff; font-weight:600; pointer-events:none; border:1px solid rgba(255,255,255,0.2); }
        .toast.success { background:#2d5a3d; } .toast.error { background:#5a2d2d; } .toast.info { background:#2d3d5a; }

        .lightbox { position:fixed; inset:0; background:rgba(2,2,10,0.94); z-index:10000; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; border:2px solid rgba(212,168,83,0.5); }

        .back-to-top { position:fixed; bottom:28px; right:28px; z-index:900; width:42px; height:42px; border-radius:50%; background:rgba(20,18,30,0.85); border:1.5px solid var(--border-gold); color:var(--gold-light); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .back-to-top.visible { opacity:1; pointer-events:auto; }

        @media (max-width:768px) {
            .app-header { flex-direction:column; }
            .search-bar { flex-direction:column; }
            .modal-panel { padding:20px 16px; max-height:88vh; }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="mountains-bg"></div>

    <!-- 登录 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="seal-icon">🏮</div>
            <h1>墨 韵 题 库</h1>
            <p class="subtitle">· 古风雅韵 · 科技之光 ·</p>
            <div class="input-group"><label>👤 道号</label><input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username"></div>
            <div class="input-group"><label>🔑 秘钥</label><input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password"></div>
            <button class="btn-login" id="btnLogin">开 启 卷 轴</button>
            <p class="error-msg" id="loginError"></p>
        </div>
    </div>

    <!-- 主应用 -->
    <div class="app-container" id="appContainer">
        <div class="app-header">
            <div class="brand"><span>🏮</span><span>墨韵题库</span></div>
            <div class="user-info-area">
                <span id="displayUsername"></span>
                <span class="badge-role" id="displayRole"></span>
                <button class="btn btn-outline btn-sm" id="btnAddQuestion" style="display:none;" onclick="openEditor()">➕ 录入新题</button>
                <button class="btn btn-ghost btn-sm" onclick="handleLogout()">🚪 归隐</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchKeyword" placeholder="🔍 搜题目、编号、标签…" oninput="onSearchInput()">
            <select id="filterCategory" onchange="renderQuestions()"><option value="">📂 万卷归宗</option></select>
            <span id="resultCount" style="color:var(--text-dim);font-size:12px;"></span>
        </div>
        <div class="stats-bar">
            <span class="stat-item">📜 总卷 <span class="stat-value" id="statTotal">0</span></span>
            <span class="stat-item">📂 分类 <span class="stat-value" id="statCategories">0</span></span>
            <span class="stat-item">🏷️ 标签筛选 <span class="stat-value" id="activeTagsDisplay">无</span></span>
            <span style="margin-left:auto;display:flex;gap:4px;">
                <button class="btn btn-sm" id="viewGridBtn" onclick="setViewMode('grid')">▦ 网格</button>
                <button class="btn btn-sm" id="viewListBtn" onclick="setViewMode('list')">☰ 列表</button>
            </span>
        </div>
        <div class="questions-grid" id="questionsGrid"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- 编辑模态框 -->
    <div id="editorModal" style="display:none;">
        <div class="modal-overlay" onclick="closeEditor()">
            <div class="modal-panel" onclick="event.stopPropagation()" style="max-width:820px;">
                <h2 id="editorTitle">📜 录入新题</h2>
                <input type="hidden" id="editId">
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:180px;"><label>📌 题号 *</label><input type="text" id="qNumber"></div>
                    <div style="flex:2;min-width:220px;"><label>📝 题名 *</label><input type="text" id="qName"></div>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
                    <div style="flex:1;min-width:160px;"><label>📂 所属卷宗</label><input type="text" id="qCategory" list="categoryList"><datalist id="categoryList"></datalist></div>
                    <div style="flex:2;min-width:200px;"><label>🏷️ 标签 (逗号分隔)</label><input type="text" id="qTags" placeholder="动态规划, 回溯"></div>
                </div>
                <div style="margin-top:14px;">
                    <label>📄 题目内容 (Markdown)</label>
                    <div class="tab-switcher" style="display:flex;gap:4px;margin-bottom:6px;">
                        <button id="tabWrite" class="btn btn-sm active" onclick="switchTab('write')">✍️ 撰写</button>
                        <button id="tabPreview" class="btn btn-sm" onclick="switchTab('preview')">👁️ 预览</button>
                    </div>
                    <textarea id="qContentSrc" rows="7" oninput="updateEditorStats()"></textarea>
                    <div id="qContentPreview" style="display:none;min-height:90px;max-height:240px;overflow-y:auto;background:rgba(10,10,20,0.5);border:1px solid var(--border-gold);border-radius:var(--radius);padding:12px;"></div>
                    <div style="font-size:10px;color:var(--text-dim);text-align:right;" id="contentCharCount">0 字</div>
                </div>
                <div style="margin-top:14px;">
                    <label>🖼️ 图卷附件（安全检测）</label>
                    <div style="display:flex;gap:8px;">
                        <input type="file" id="imgFile" accept="image/*" multiple style="display:none;" onchange="uploadImages()">
                        <button class="btn btn-outline btn-sm" onclick="document.getElementById('imgFile').click()">📁 上传图片</button>
                        <input type="text" id="imgUrl" placeholder="或粘贴图片URL" style="flex:1;">
                        <button class="btn btn-primary btn-sm" onclick="addImgUrl()">添加URL</button>
                    </div>
                    <div class="img-preview-area" id="imgPreview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></div>
                    <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">支持 jpg/png/webp/gif，单张≤5MB，最多10张，上传即净化</div>
                </div>
                <div style="margin-top:14px;">
                    <label>💻 正确代码</label>
                    <textarea id="qCode" rows="5" style="background:#0a0c15;border:1px solid rgba(77,166,255,0.3);color:#c9d1d9;" oninput="updateEditorStats()"></textarea>
                    <div style="font-size:10px;color:var(--text-dim);text-align:right;" id="codeCharCount">0 字</div>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                    <button class="btn btn-outline" onclick="closeEditor()">取消</button>
                    <button class="btn btn-primary" id="btnSave" onclick="saveQuestion()">💾 收录入库</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div id="detailModal" style="display:none;">
        <div class="modal-overlay" onclick="closeDetail()">
            <div class="modal-panel" onclick="event.stopPropagation()">
                <h2 id="detailTitle"></h2>
                <div class="detail-content" id="detailContent"></div>
                <div class="detail-code" id="detailCode"></div>
                <div style="display:flex;justify-content:flex-end;margin-top:18px;">
                    <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div id="lightbox" style="display:none;" class="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src=""></div>
    <div id="toastContainer"></div>
    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆</button>

    <script>
        (() => {
            const API = 'https://myzlm.serveousercontent.com';
            const PAGE_SIZE = 12;

            const UPLOAD_CONFIG = {
                MAX_FILE_SIZE: 5 * 1024 * 1024,
                MAX_TOTAL_IMAGES: 10,
                ALLOWED_MIME: ['image/jpeg','image/png','image/webp','image/gif'],
                ALLOWED_EXT: ['.jpg','.jpeg','.png','.webp','.gif'],
                MAX_DIMENSION: 4096,
                COMPRESS_WIDTH: 1200,
                COMPRESS_QUALITY: 0.7
            };

            // 粒子类
            class Particle {
                constructor(x,y){ this.reset(x,y); }
                reset(x,y){
                    this.x = x ?? Math.random()*canvas.width;
                    this.y = y ?? Math.random()*canvas.height;
                    this.size = Math.random()*2.2+0.4;
                    this.vx = (Math.random()-0.5)*0.35;
                    this.vy = (Math.random()-0.5)*0.35;
                    this.opacity = Math.random()*0.4+0.12;
                    this.fadeSpeed = Math.random()*0.003+0.0008;
                    this.hue = Math.random()<0.55?42:(Math.random()<0.5?200:280);
                    this.glow = Math.random()<0.25;
                }
                update(){
                    this.x+=this.vx; this.y+=this.vy;
                    this.opacity+=(Math.random()-0.5)*this.fadeSpeed;
                    this.opacity = Math.max(0.04, Math.min(0.55, this.opacity));
                    if(this.x<-15) this.x=canvas.width+15; if(this.x>canvas.width+15) this.x=-15;
                    if(this.y<-15) this.y=canvas.height+15; if(this.y>canvas.height+15) this.y=-15;
                }
                draw(ctx){
                    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                    ctx.fillStyle = `hsla(${this.hue},60%,62%,${this.opacity})`;
                    if(this.glow){ ctx.shadowColor=`hsla(${this.hue},70%,58%,${this.opacity*0.65})`; ctx.shadowBlur=5; }
                    else ctx.shadowBlur=0;
                    ctx.fill(); ctx.shadowBlur=0;
                }
            }
            class SparkParticle {
                constructor(x,y){
                    this.x=x; this.y=y;
                    const a=Math.random()*Math.PI*2,s=Math.random()*3.5+2;
                    this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s;
                    this.life=1; this.decay=0.018+Math.random()*0.025; this.size=Math.random()*2.2+0.8;
                }
                update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.05; this.life-=this.decay; this.size*=0.985; }
                draw(ctx){
                    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                    ctx.fillStyle=`hsla(42,85%,58%,${this.life})`;
                    ctx.shadowColor=`hsla(42,90%,52%,${this.life*0.55})`; ctx.shadowBlur=7;
                    ctx.fill(); ctx.shadowBlur=0;
                }
                get dead(){ return this.life<=0; }
            }

            const canvas = document.getElementById('particleCanvas'), ctx = canvas.getContext('2d');
            let particles=[], mouseParticles=[], particleCount=80;

            function resizeCanvas(){
                canvas.width=innerWidth; canvas.height=innerHeight;
                particleCount = innerWidth<600?40:80;
                if(particles.length>particleCount) particles.length=particleCount;
                while(particles.length<particleCount) particles.push(new Particle());
            }
            addEventListener('resize',resizeCanvas); resizeCanvas();

            function burst(x,y){ for(let i=0;i<16;i++) mouseParticles.push(new SparkParticle(x,y)); }
            document.addEventListener('click', e => {
                if(e.target.closest('.modal-overlay')||e.target.closest('.lightbox')) return;
                burst(e.clientX,e.clientY);
            });
            function animateParticles(){
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p=>{p.update();p.draw(ctx);});
                mouseParticles.forEach(p=>{p.update();p.draw(ctx);});
                mouseParticles=mouseParticles.filter(p=>!p.dead);
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // 全局状态
            let allQuestions=[], allCategories=[], allTags=[];
            let currentUser=null, tempImages=[], currentTab='write', currentPage=1, activeTags=new Set();
            let viewMode = localStorage.getItem('viewMode') || 'grid';
            const $ = s => document.querySelector(s);
            const dom = {
                loginOverlay:$('#loginOverlay'), appContainer:$('#appContainer'),
                displayUsername:$('#displayUsername'), displayRole:$('#displayRole'),
                btnAddQuestion:$('#btnAddQuestion'), searchKeyword:$('#searchKeyword'),
                filterCategory:$('#filterCategory'), resultCount:$('#resultCount'),
                questionsGrid:$('#questionsGrid'), pagination:$('#pagination'),
                statTotal:$('#statTotal'), statCategories:$('#statCategories'),
                activeTagsDisplay:$('#activeTagsDisplay'),
                viewGridBtn:$('#viewGridBtn'), viewListBtn:$('#viewListBtn'),
                editorModal:$('#editorModal'), editId:$('#editId'),
                qNumber:$('#qNumber'), qName:$('#qName'), qCategory:$('#qCategory'), qTags:$('#qTags'),
                qContentSrc:$('#qContentSrc'), qContentPreview:$('#qContentPreview'),
                qCode:$('#qCode'), imgUrl:$('#imgUrl'), imgPreview:$('#imgPreview'),
                btnSave:$('#btnSave'), editorTitle:$('#editorTitle'),
                detailModal:$('#detailModal'), detailTitle:$('#detailTitle'),
                detailContent:$('#detailContent'), detailCode:$('#detailCode'),
                lightbox:$('#lightbox'), lightboxImg:$('#lightboxImg'), backToTop:$('#backToTop'),
                tabWrite:$('#tabWrite'), tabPreview:$('#tabPreview'),
                contentCharCount:$('#contentCharCount'), codeCharCount:$('#codeCharCount'),
                categoryList:$('#categoryList')
            };

            function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
            function escJs(s){ return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n'); }
            function showToast(msg,type='info'){
                const t=document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
                $('#toastContainer').appendChild(t);
                setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);
            }
            function renderMarkdown(text){
                if(!text) return '';
                try{ return marked.parse(text,{breaks:true,gfm:true}); }catch(e){ return escHtml(text); }
            }
            async function renderMathMermaid(container){
                if(!container) return;
                if(window.katex && typeof renderMathInElement==='function'){
                    try{ renderMathInElement(container,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }catch(e){}
                }
                const mermaidEls=container.querySelectorAll('.mermaid');
                if(mermaidEls.length && window.mermaid){ try{ await mermaid.run({nodes:Array.from(mermaidEls),suppressErrors:true}); }catch(e){} }
                if(window.hljs) container.querySelectorAll('pre code').forEach(b=>{ try{hljs.highlightElement(b);}catch(e){} });
            }
            function copyToClipboard(text,btn){
                navigator.clipboard.writeText(text).then(()=>{
                    const orig=btn.textContent; btn.textContent='✅ 已复制'; btn.style.color='#7ec8a0';
                    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},1500);
                }).catch(()=>{
                    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed';ta.style.opacity='0';
                    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){}
                    document.body.removeChild(ta); const orig=btn.textContent; btn.textContent='✅';
                    setTimeout(()=>{btn.textContent=orig;},1500);
                });
            }

            // ---------- 权限判断 ----------
            function isAdminOrOwner() {
                return currentUser && (currentUser.role === 'owner' || currentUser.role === 'admin');
            }

            // 认证
            async function checkAuth(){
                try{
                    const r=await fetch(API+'/api/me',{credentials:'include'});
                    if(r.ok){ const d=await r.json(); if(d?.username){ currentUser=d; showApp(); return; } }
                    showLogin();
                }catch(e){ showLogin(); }
            }
            function showLogin(){
                dom.loginOverlay.classList.remove('hidden'); dom.appContainer.classList.remove('active');
                document.body.style.overflow='';
            }
            function showApp(){
                dom.loginOverlay.classList.add('hidden'); dom.appContainer.classList.add('active');
                document.body.style.overflow='';
                dom.displayUsername.textContent=currentUser.username;

                // 角色中文映射
                const roleMap = { owner: '宗主', admin: '长老', member: '弟子' };
                const roleName = roleMap[currentUser.role] || '访客';
                dom.displayRole.textContent = roleName;
                // 清除旧类名，添加新角色类名
                dom.displayRole.className = 'badge-role ' + currentUser.role;

                // 显示添加按钮（owner 和 admin 均可）
                dom.btnAddQuestion.style.display = isAdminOrOwner() ? 'inline-flex' : 'none';

                loadQuestions();
            }
            async function handleLogin(){
                const u=document.getElementById('loginUsername').value.trim();
                const p=document.getElementById('loginPassword').value;
                if(!u||!p){ document.getElementById('loginError').textContent='请输入道号和秘钥'; return; }
                const btn=document.getElementById('btnLogin'); btn.textContent='开启中…'; btn.disabled=true;
                try{
                    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:u,password:p})});
                    const d=await r.json();
                    if(r.ok && d.username){ currentUser={username:d.username,role:d.role}; showApp(); showToast('卷轴已开启','success'); }
                    else document.getElementById('loginError').textContent = d.error||'登录失败';
                }catch(e){ document.getElementById('loginError').textContent='无法连接服务器'; }
                finally{ btn.textContent='开 启 卷 轴'; btn.disabled=false; }
            }
            async function handleLogout(){
                try{ await fetch(API+'/api/logout',{method:'POST',credentials:'include'}); }catch(e){}
                currentUser=null; allQuestions=[]; allCategories=[]; allTags=[]; activeTags.clear(); currentPage=1;
                showLogin(); document.body.style.overflow=''; showToast('已归隐','info');
            }

            // 数据加载
            async function loadQuestions(){
                try{
                    const r=await fetch(API+'/api/questions',{credentials:'include'});
                    if(r.status===401){ handleLogout(); return; }
                    const d=await r.json();
                    allQuestions=(d.questions||[]).map(q=>({
                        ...q,
                        tags: q.tags||(typeof q.tags==='string'?q.tags.split(/[,，]/).map(t=>t.trim()).filter(Boolean):[]),
                        images: q.images||[]
                    }));
                    allCategories = d.categories||[];
                    if(!allCategories.length && allQuestions.length){
                        const catSet=new Set(allQuestions.map(q=>q.category).filter(Boolean));
                        allCategories=Array.from(catSet).sort((a,b)=>a.localeCompare(b));
                    } else allCategories.sort((a,b)=>a.localeCompare(b));
                    const tagSet=new Set(); allQuestions.forEach(q=>(q.tags||[]).forEach(t=>tagSet.add(t)));
                    allTags=Array.from(tagSet).sort();
                    updateCategoryFilter(); renderQuestions();
                }catch(e){ showToast('加载失败','error'); }
            }
            function updateCategoryFilter(){
                const sel=dom.filterCategory, cv=sel.value;
                sel.innerHTML='<option value="">📂 万卷归宗</option>';
                allCategories.forEach(c=> sel.innerHTML+=`<option value="${escHtml(c)}" ${cv===c?'selected':''}>📂 ${escHtml(c)}</option>`);
                dom.categoryList.innerHTML=allCategories.map(c=>`<option value="${escHtml(c)}">`).join('');
            }
            function sortQuestions(list){
                return list.sort((a,b)=>{
                    const ca=(a.category||'').toLowerCase(), cb=(b.category||'').toLowerCase();
                    if(ca!==cb) return ca.localeCompare(cb);
                    return (a.number||'').localeCompare(b.number||'');
                });
            }
            function getFiltered(){
                const kw=dom.searchKeyword.value.trim().toLowerCase(), cat=dom.filterCategory.value;
                let filtered=allQuestions;
                if(activeTags.size>0) filtered=filtered.filter(q=>(q.tags||[]).some(t=>activeTags.has(t)));
                if(kw) filtered=filtered.filter(q=>
                    (q.number||'').toLowerCase().includes(kw)||(q.name||'').toLowerCase().includes(kw)||
                    (q.content||'').toLowerCase().includes(kw)||(q.code||'').toLowerCase().includes(kw)||
                    (q.category||'').toLowerCase().includes(kw)||(q.tags||[]).some(t=>t.toLowerCase().includes(kw))
                );
                if(cat) filtered=filtered.filter(q=>q.category===cat);
                return sortQuestions(filtered);
            }

            function toggleTag(tag) {
                if(activeTags.has(tag)) activeTags.delete(tag);
                else activeTags.add(tag);
                updateActiveTagsUI();
                currentPage = 1;
                renderQuestions();
            }
            function updateActiveTagsUI() {
                const display = activeTags.size ? [...activeTags].map(t=>`#${t}`).join(', ') : '无';
                dom.activeTagsDisplay.textContent = display;
                document.querySelectorAll('.q-tag').forEach(el => {
                    const tag = el.textContent.replace('#','');
                    el.classList.toggle('active', activeTags.has(tag));
                });
            }

            // ---------- 3D 悬停效果绑定 ----------
            function bind3DToCards() {
                const cards = document.querySelectorAll('.question-card');
                cards.forEach(card => {
                    card.addEventListener('mousemove', e => {
                        const rect = card.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const rotateY = ((x - centerX) / centerX) * 10;   // 最大旋转 ±10度
                        const rotateX = ((centerY - y) / centerY) * 10;
                        card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale(1)';
                    });
                });
            }

            function renderQuestions(){
                const filtered=getFiltered(), total=filtered.length;
                const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
                if(currentPage>totalPages) currentPage=totalPages;
                const start=(currentPage-1)*PAGE_SIZE, pageItems=filtered.slice(start,start+PAGE_SIZE);
                dom.statTotal.textContent=allQuestions.length;
                dom.statCategories.textContent=allCategories.length;
                dom.resultCount.textContent=`共 ${total} 卷`;
                updateActiveTagsUI();
                const grid=dom.questionsGrid;
                const canEdit = isAdminOrOwner();
                if(!pageItems.length){
                    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim);">📭 无匹配之卷</div>';
                    dom.pagination.innerHTML=''; 
                    bind3DToCards();
                    return;
                }
                grid.innerHTML=pageItems.map((q,idx)=>{
                    const imgs=(q.images&&q.images.length)?`<div class="card-images-row">${q.images.map(i=>`<img src="${escHtml(i)}" onclick="event.stopPropagation();openLightbox('${escHtml(i)}')">`).join('')}</div>`:'';
                    const tagsHtml=(q.tags&&q.tags.length)?`<div class="q-tags">${q.tags.map(t=>`<span class="q-tag ${activeTags.has(t)?'active':''}" onclick="event.stopPropagation();toggleTag('${escJs(t)}')">#${escHtml(t)}</span>`).join('')}</div>`:'';
                    const actions=canEdit?`<div class="card-actions" onclick="event.stopPropagation()" style="display:flex;gap:7px;justify-content:flex-end;padding-top:4px;"><button class="btn btn-outline btn-xs" onclick="openEditor('${q.id}')">✏️</button><button class="btn btn-danger btn-xs" onclick="deleteQuestion('${q.id}')">🗑</button></div>`:'';
                    return `<div class="question-card" onclick="openDetail('${q.id}')" style="animation-delay:${idx*0.03}s">
                        <div class="card-header">
                            ${q.number?`<span class="q-number">#${escHtml(q.number)}</span>`:''}
                            ${q.category?`<span class="q-category">📂 ${escHtml(q.category)}</span>`:''}
                        </div>
                        <div class="q-name">${escHtml(q.name||'无名之题')}</div>
                        ${tagsHtml} ${imgs} ${actions}
                    </div>`;
                }).join('');
                let pagHtml='';
                if(totalPages>1){
                    pagHtml+=`<button ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})">◀ 上一页</button>`;
                    const maxVis=5; let startP=Math.max(1,currentPage-Math.floor(maxVis/2));
                    let endP=Math.min(totalPages,startP+maxVis-1);
                    if(endP-startP<maxVis-1) startP=Math.max(1,endP-maxVis+1);
                    if(startP>1) pagHtml+=`<button onclick="goToPage(1)">1</button>`;
                    if(startP>2) pagHtml+=`<span class="page-info">…</span>`;
                    for(let i=startP;i<=endP;i++) pagHtml+=`<button class="${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
                    if(endP<totalPages-1) pagHtml+=`<span class="page-info">…</span>`;
                    if(endP<totalPages) pagHtml+=`<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
                    pagHtml+=`<button ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})">下一页 ▶</button>`;
                }
                pagHtml+=`<span class="page-info" style="color:var(--text-dim);font-size:12px;padding:0 8px;">共 ${total} 卷</span>`;
                dom.pagination.innerHTML=pagHtml;
                // 绑定 3D 事件
                bind3DToCards();
            }
            function goToPage(page){
                const filtered=getFiltered(); const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
                currentPage=Math.max(1,Math.min(page,totalPages)); renderQuestions();
                window.scrollTo({top:0,behavior:'smooth'});
            }

            function setViewMode(mode){
                viewMode = mode;
                localStorage.setItem('viewMode', mode);
                dom.questionsGrid.classList.toggle('list-view', mode==='list');
                dom.viewGridBtn.classList.toggle('active', mode==='grid');
                dom.viewListBtn.classList.toggle('active', mode==='list');
            }
            setViewMode(viewMode);

            function openDetail(id){
                const q=allQuestions.find(q=>q.id===id); if(!q) return;
                dom.detailTitle.innerHTML=`${q.number?'#'+escHtml(q.number)+' ':''}${escHtml(q.name||'')}`;
                let content=renderMarkdown(q.content||'');
                if(q.images&&q.images.length) content+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">${q.images.map(i=>`<img src="${escHtml(i)}" style="max-width:200px;max-height:150px;border-radius:6px;cursor:pointer;" onclick="openLightbox('${escHtml(i)}')">`).join('')}</div>`;
                dom.detailContent.innerHTML=content;
                if(q.code) dom.detailCode.innerHTML=`<h3 style="color:var(--gold-light);">💻 真经</h3><div style="position:relative;"><pre>${escHtml(q.code)}</pre><button class="copy-detail-btn" onclick="copyCodeDirect('${escJs(q.code)}',this)">📋 复制</button></div>`;
                else dom.detailCode.innerHTML='';
                dom.detailModal.style.display='block'; document.body.style.overflow='hidden';
                setTimeout(()=>renderMathMermaid(dom.detailContent),120);
            }
            function closeDetail(){ dom.detailModal.style.display='none'; document.body.style.overflow=''; }

            function openEditor(id=null){
                if(!isAdminOrOwner()) return showToast('仅宗主或长老可编辑','error');
                dom.editorModal.style.display='block'; document.body.style.overflow='hidden';
                dom.editId.value=id||'';
                if(id){
                    const q=allQuestions.find(q=>q.id===id); if(!q) return;
                    dom.editorTitle.textContent='✏️ 修缮题目';
                    dom.qNumber.value=q.number||''; dom.qName.value=q.name||'';
                    dom.qCategory.value=q.category||''; dom.qTags.value=(q.tags||[]).join(', ');
                    dom.qContentSrc.value=q.content||''; dom.qCode.value=q.code||'';
                    tempImages=[...(q.images||[])];
                } else {
                    dom.editorTitle.textContent='📜 录入新题';
                    ['qNumber','qName','qCategory','qTags','qContentSrc','qCode','imgUrl'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
                    tempImages=[];
                }
                switchTab('write'); renderImgPreview(); updateEditorStats();
            }
            function closeEditor(){ dom.editorModal.style.display='none'; document.body.style.overflow=''; }
            function switchTab(tab){
                currentTab=tab;
                dom.tabWrite.classList.toggle('active',tab==='write');
                dom.tabPreview.classList.toggle('active',tab==='preview');
                dom.qContentSrc.style.display = tab==='write'?'block':'none';
                if(tab==='preview'){
                    dom.qContentPreview.style.display='block';
                    dom.qContentPreview.innerHTML=renderMarkdown(dom.qContentSrc.value);
                    renderMathMermaid(dom.qContentPreview);
                } else dom.qContentPreview.style.display='none';
            }
            function updateEditorStats(){
                dom.contentCharCount.textContent=(dom.qContentSrc.value||'').length+' 字';
                dom.codeCharCount.textContent=(dom.qCode.value||'').length+' 字';
                if(currentTab==='preview'){
                    dom.qContentPreview.innerHTML=renderMarkdown(dom.qContentSrc.value);
                    renderMathMermaid(dom.qContentPreview);
                }
            }

            function uploadImages(){ /* 保持原有安全上传逻辑不变 */ 
                const files = document.getElementById('imgFile').files;
                if(!files.length) return;
                Array.from(files).forEach(file => {
                    if(tempImages.length >= UPLOAD_CONFIG.MAX_TOTAL_IMAGES) { showToast(`最多上传${UPLOAD_CONFIG.MAX_TOTAL_IMAGES}张图片`,'error'); return; }
                    if(file.size > UPLOAD_CONFIG.MAX_FILE_SIZE) { showToast(`图片"${file.name}"超过5MB`,'error'); return; }
                    if(!UPLOAD_CONFIG.ALLOWED_MIME.includes(file.type)) { showToast(`不允许的文件类型: ${file.type}`,'error'); return; }
                    const ext = '.' + file.name.split('.').pop().toLowerCase();
                    if(!UPLOAD_CONFIG.ALLOWED_EXT.includes(ext)) { showToast(`不允许的扩展名: ${ext}`,'error'); return; }
                    const reader = new FileReader();
                    reader.onerror = () => showToast(`读取文件"${file.name}"失败`,'error');
                    reader.onload = ev => {
                        const img = new Image();
                        img.onerror = () => showToast(`"${file.name}"不是有效图片`,'error');
                        img.onload = () => {
                            if(img.width > UPLOAD_CONFIG.MAX_DIMENSION || img.height > UPLOAD_CONFIG.MAX_DIMENSION) { showToast(`图片尺寸过大(最大${UPLOAD_CONFIG.MAX_DIMENSION}px)`,'error'); return; }
                            const c = document.createElement('canvas');
                            let w=img.width, h=img.height;
                            if(w > UPLOAD_CONFIG.COMPRESS_WIDTH) { h=Math.round(h*UPLOAD_CONFIG.COMPRESS_WIDTH/w); w=UPLOAD_CONFIG.COMPRESS_WIDTH; }
                            c.width=w; c.height=h;
                            const ctx2d=c.getContext('2d');
                            ctx2d.fillStyle='#FFFFFF'; ctx2d.fillRect(0,0,w,h);
                            ctx2d.drawImage(img,0,0,w,h);
                            try {
                                const sanitized = c.toDataURL('image/jpeg', UPLOAD_CONFIG.COMPRESS_QUALITY);
                                tempImages.push(sanitized);
                                renderImgPreview();
                            } catch(e) { showToast('图片处理失败','error'); }
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                document.getElementById('imgFile').value = '';
            }
            function addImgUrl(){ /* 保持原有逻辑 */
                const url = dom.imgUrl.value.trim();
                if(!url) return;
                if(tempImages.length >= UPLOAD_CONFIG.MAX_TOTAL_IMAGES) { showToast(`最多上传${UPLOAD_CONFIG.MAX_TOTAL_IMAGES}张图片`,'error'); return; }
                try {
                    const parsed = new URL(url);
                    if(!['http:','https:'].includes(parsed.protocol)) { showToast('仅支持 HTTP/HTTPS 链接','error'); return; }
                    const host = parsed.hostname.toLowerCase();
                    if(host==='localhost'||host==='127.0.0.1'||host.startsWith('192.168.')||host.startsWith('10.')||host.startsWith('172.16.')) { showToast('不允许引用内网地址','error'); return; }
                    const path = parsed.pathname.toLowerCase();
                    if(!UPLOAD_CONFIG.ALLOWED_EXT.some(ext => path.endsWith(ext)) && !path.includes('?')) { showToast('URL 看起来不像图片链接','error'); return; }
                    tempImages.push(url);
                    dom.imgUrl.value = '';
                    renderImgPreview();
                } catch(e) { showToast('无效的URL格式','error'); }
            }
            function removeImg(i){ tempImages.splice(i,1); renderImgPreview(); }
            function renderImgPreview(){
                const area=dom.imgPreview;
                if(!tempImages.length){ area.innerHTML='<span style="font-size:11px;color:var(--text-dim);">暂无图卷</span>'; return; }
                area.innerHTML = tempImages.map((img,i)=>`
                    <div style="position:relative;width:72px;height:72px;border:1px solid var(--border-gold);border-radius:4px;overflow:hidden;">
                        <img src="${escHtml(img)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='data:image/svg+xml,...'">
                        <button onclick="removeImg(${i})" style="position:absolute;top:2px;right:2px;background:rgba(200,40,30,0.85);color:#fff;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px;">×</button>
                    </div>
                `).join('');
            }

            async function saveQuestion(){
                if(!isAdminOrOwner()) return showToast('无权限','error');
                const editId=dom.editId.value, number=dom.qNumber.value.trim(), name=dom.qName.value.trim();
                if(!number||!name) return showToast('题号与题名必填','error');
                const tagsRaw=dom.qTags.value.trim();
                const data={
                    number, name,
                    category: dom.qCategory.value.trim(),
                    tags: tagsRaw ? tagsRaw.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [],
                    content: dom.qContentSrc.value,
                    code: dom.qCode.value,
                    images: [...tempImages]
                };
                dom.btnSave.textContent='收录中…'; dom.btnSave.disabled=true;
                try{
                    const url = editId ? `${API}/api/questions/${encodeURIComponent(editId)}` : `${API}/api/questions`;
                    const method = editId?'PUT':'POST';
                    const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify(data)});
                    if(r.status===401){ handleLogout(); return; }
                    const d=await r.json();
                    if(r.ok && (d.success||d.question)){ closeEditor(); await loadQuestions(); showToast(editId?'修缮成功':'新题收录','success'); }
                    else showToast(d.error||'保存失败','error');
                }catch(e){ showToast('网络错误','error'); }
                finally{ dom.btnSave.textContent='💾 收录入库'; dom.btnSave.disabled=false; }
            }
            async function deleteQuestion(id){
                if(!isAdminOrOwner()) return;
                if(!confirm('确定焚毁此题？')) return;
                try{
                    const r=await fetch(`${API}/api/questions/${encodeURIComponent(id)}`,{method:'DELETE',credentials:'include'});
                    if(r.status===401){ handleLogout(); return; }
                    if(r.ok){ await loadQuestions(); showToast('已焚毁','info'); }
                }catch(e){ showToast('删除失败','error'); }
            }
            function openLightbox(src){ dom.lightboxImg.src=src; dom.lightbox.style.display='flex'; document.body.style.overflow='hidden'; }
            function closeLightbox(){ dom.lightbox.style.display='none'; document.body.style.overflow=''; }

            let searchTimer;
            function onSearchInput(){ clearTimeout(searchTimer); searchTimer=setTimeout(()=>{ currentPage=1; renderQuestions(); },300); }

            window.addEventListener('scroll', ()=>{ dom.backToTop.classList.toggle('visible', scrollY>500); }, {passive:true});
            document.addEventListener('keydown', e=>{
                if(e.key==='Escape'){
                    if(dom.lightbox.style.display==='flex') closeLightbox();
                    else if(dom.detailModal.style.display==='block') closeDetail();
                    else if(dom.editorModal.style.display==='block') closeEditor();
                }
                if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); dom.searchKeyword.focus(); }
                if(!e.target.closest('input,textarea,select')&&!e.ctrlKey&&!e.metaKey){
                    if(e.key==='ArrowLeft') goToPage(currentPage-1);
                    if(e.key==='ArrowRight') goToPage(currentPage+1);
                }
            });

            document.addEventListener('DOMContentLoaded', ()=>{
                checkAuth();
                document.getElementById('btnLogin').addEventListener('click', handleLogin);
                document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); });
            });

            // 全局暴露
            window.goToPage=goToPage;
            window.copyCodeDirect=function(code,btn){ copyToClipboard(code,btn); };
            window.toggleTag=toggleTag;
            window.setViewMode=setViewMode;
            window.openDetail=openDetail; window.closeDetail=closeDetail;
            window.openEditor=openEditor; window.closeEditor=closeEditor;
            window.switchTab=switchTab;
            window.uploadImages=uploadImages; window.addImgUrl=addImgUrl;
            window.removeImg=removeImg; window.saveQuestion=saveQuestion;
            window.deleteQuestion=deleteQuestion;
            window.openLightbox=openLightbox; window.closeLightbox=closeLightbox;
            window.handleLogout=handleLogout;
            window.onSearchInput=onSearchInput;
            window.renderQuestions=renderQuestions;
        })();
    </script>
</body>
</html>
