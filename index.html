<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 我的题库管理系统</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54d4;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --text: #2c3e50;
            --text-secondary: #6b7b8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 登录页面 ========== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 36px;
            width: 420px;
            max-width: 90vw;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .login-card .logo-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-card h1 {
            font-size: 22px;
            margin-bottom: 4px;
            color: var(--text);
        }
        .login-card .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .login-card .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .login-card input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: var(--transition);
            background: #fafbfc;
            color: var(--text);
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
            background: #fff;
        }
        .login-card .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .login-card .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .login-card .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
        .login-card .api-config {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .login-card .api-config:hover {
            color: var(--primary);
        }
        .login-card .api-url-display {
            display: block;
            font-size: 11px;
            margin-top: 4px;
            color: #888;
            word-break: break-all;
        }

        /* ========== 主布局 ========== */
        .app-container {
            display: none;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .app-container.active {
            display: block;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .app-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .logo {
            font-size: 28px;
        }
        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .app-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .app-header .badge {
            background: #e8f0fe;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #f5f7ff;
        }
        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 2px solid var(--danger);
        }
        .btn-danger:hover {
            background: #fff5f5;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            padding: 6px 10px;
        }
        .btn-ghost:hover {
            background: #f5f6f8;
            color: var(--text);
            border-color: var(--border);
        }
        .btn-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 16px;
        }

        /* ========== 搜索栏 ========== */
        .search-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-bar input,
        .search-bar select {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            color: var(--text);
            transition: var(--transition);
            min-width: 140px;
        }
        .search-bar input:focus,
        .search-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08);
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
        }
        .search-bar .result-count {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ========== 题目卡片 ========== */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        @media (max-width: 500px) {
            .questions-grid {
                grid-template-columns: 1fr;
            }
        }
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .question-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #dce3f0;
            transform: translateY(-2px);
        }
        .question-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .question-card .q-number {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 13px;
            color: var(--primary);
            background: #eef2ff;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .question-card .q-category {
            font-size: 12px;
            background: #f0fdf4;
            color: #15803d;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }
        .question-card .q-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
            flex: 1;
        }
        .question-card .q-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
            background: #fafbfc;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #e1e5eb;
        }
        .question-card .q-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .question-card .q-images img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            object-fit: contain;
            background: #fafafa;
            transition: var(--transition);
        }
        .question-card .q-images img:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        .question-card .q-code {
            font-family: var(--font-mono);
            font-size: 13px;
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 12px 14px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            position: relative;
            line-height: 1.5;
        }
        .question-card .code-label {
            font-size: 11px;
            color: #a0a8c0;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .question-card .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #cdd6f4;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
        }
        .question-card .q-code:hover .copy-btn {
            opacity: 1;
        }
        .question-card .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .question-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 16px;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 700px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 24px;
            animation: slideUp 0.25s;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--text);
        }
        .modal input[type="text"],
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            background: #fafbfc;
            color: var(--text);
            resize: vertical;
        }
        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08);
            background: #fff;
        }
        .modal textarea {
            min-height: 100px;
            font-family: inherit;
        }
        .modal textarea.code-textarea {
            font-family: var(--font-mono);
            min-height: 140px;
            background: #1e1e2e;
            color: #cdd6f4;
            border-color: #333;
            tab-size: 4;
        }
        .modal .image-preview-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .modal .image-preview-area .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid var(--border);
            background: #fafafa;
        }
        .modal .image-preview-area .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal .image-preview-area .preview-item .remove-img {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(231, 76, 60, 0.9);
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal .char-count {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 2px;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            animation: slideIn 0.3s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast.success {
            background: #27ae60;
        }
        .toast.error {
            background: #e74c3c;
        }
        .toast.info {
            background: #4f6ef7;
        }

        /* ========== 图片放大 ========== */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c4c9d4;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a7b4;
        }

        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar input,
            .search-bar select {
                width: 100%;
                min-width: auto;
            }
            .questions-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 18px 14px;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 登录界面 ==================== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo-icon">📚</div>
            <h1>我的题库</h1>
            <p class="subtitle">安全题库管理系统</p>
            <div class="input-group">
                <label>👤 账号</label>
                <input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username">
            </div>
            <div class="input-group">
                <label>🔒 密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn-login" id="btnLogin">登 录</button>
            <p class="error-msg" id="loginError"></p>
            <div class="api-config" onclick="setApiUrl()">
                ⚙️ 配置服务器地址
            </div>
            <span class="api-url-display" id="apiUrlDisplay"></span>
            <p class="hint" style="margin-top:8px;font-size:11px;color:#999;">默认管理员：zlm / zlm20130503</p>
        </div>
    </div>

    <!-- ==================== 主应用 ==================== -->
    <div class="app-container" id="appContainer">
        <!-- 头部 -->
        <div class="app-header">
            <div class="header-left">
                <span class="logo">📚</span>
                <h1>我的题库</h1>
            </div>
            <div class="user-info">
                <span>👤 <strong id="displayUsername"></strong></span>
                <span class="badge" id="displayRole"></span>
                <button class="btn btn-outline btn-sm" id="btnAddQuestion" onclick="openAddModal()">➕ 添加题目</button>
                <button class="btn btn-ghost btn-sm" onclick="setApiUrl()" title="设置API地址">⚙️</button>
                <button class="btn btn-ghost btn-sm" onclick="handleLogout()">🚪 退出</button>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" id="searchKeyword" placeholder="🔍 搜索题目名称、内容、编号、代码..." oninput="renderQuestions()">
            <select id="filterCategory" onchange="renderQuestions()">
                <option value="">📂 全部题库</option>
            </select>
            <span class="result-count" id="resultCount"></span>
        </div>

        <!-- 题目列表 -->
        <div class="questions-grid" id="questionsGrid"></div>
    </div>

    <!-- ==================== 添加/编辑题目模态框 ==================== -->
    <div id="questionModal" style="display:none;">
        <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <h2 id="modalTitle">➕ 添加题目</h2>
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>📌 题目编号 <span style="color:#e74c3c;">*</span></label>
                    <input type="text" id="qNumber" placeholder="例如：LC001、ALG-1001">
                </div>
                <div class="form-group">
                    <label>📝 题目名称 <span style="color:#e74c3c;">*</span></label>
                    <input type="text" id="qName" placeholder="输入题目名称">
                </div>
                <div class="form-group">
                    <label>📂 所属题库</label>
                    <input type="text" id="qCategory" placeholder="例如：LeetCode、算法、数据结构" list="categorySuggestions">
                    <datalist id="categorySuggestions"></datalist>
                </div>
                <div class="form-group">
                    <label>📄 题目内容（支持文字描述）</label>
                    <textarea id="qContent" rows="4" placeholder="输入题目详细内容..."></textarea>
                    <div class="char-count" id="contentCharCount">0 字</div>
                </div>
                <div class="form-group">
                    <label>🖼️ 题目图片（可选，点击上传或粘贴URL）</label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event)">
                        <button class="btn btn-outline btn-sm" onclick="document.getElementById('imageFileInput').click()">📁 上传图片</button>
                        <input type="text" id="imageUrlInput" placeholder="或粘贴图片URL" style="flex:1;min-width:150px;" onkeydown="if(event.key==='Enter'){addImageUrl();event.preventDefault();}">
                        <button class="btn btn-primary btn-sm" onclick="addImageUrl()">添加</button>
                    </div>
                    <div class="image-preview-area" id="imagePreviewArea"></div>
                </div>
                <div class="form-group">
                    <label>💻 正确代码</label>
                    <textarea id="qCode" class="code-textarea" rows="6" placeholder="输入正确代码..."></textarea>
                    <div class="char-count" id="codeCharCount">0 字</div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" id="btnSave" onclick="saveQuestion()">💾 保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 图片灯箱 ==================== -->
    <div id="lightbox" style="display:none;" class="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="题目图片">
    </div>

    <!-- ==================== Toast容器 ==================== -->
    <div id="toastContainer"></div>

    <script>
        // ==================== 配置 ====================
        function getApiBaseUrl() {
            const saved = localStorage.getItem('api_base_url');
            if (saved) return saved.replace(/\/$/, ''); // 移除末尾斜杠
            // 默认值：如果当前页面在本地开发环境，自动使用 localhost:3001
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3001';
            }
            return ''; // 生产环境必须手动配置
        }

        let API_BASE_URL = getApiBaseUrl();

        // 显示当前API地址
        function updateApiUrlDisplay() {
            const display = document.getElementById('apiUrlDisplay');
            if (display) {
                display.textContent = API_BASE_URL ? `当前服务器：${API_BASE_URL}` : '未配置服务器地址，请点击上方链接设置';
            }
        }

        // 设置API地址
        function setApiUrl() {
            const current = API_BASE_URL || (window.location.hostname === 'localhost' ? 'http://localhost:3001' : '');
            const newUrl = prompt('请输入题库后端地址（例如 https://your-domain.serveo.net）', current);
            if (newUrl) {
                const cleanUrl = newUrl.trim().replace(/\/$/, '');
                localStorage.setItem('api_base_url', cleanUrl);
                API_BASE_URL = cleanUrl;
                updateApiUrlDisplay();
                showToast('服务器地址已更新，请重新登录', 'info');
                // 如果已登录，建议刷新
                if (currentUser) {
                    handleLogout();
                }
            }
        }

        // ==================== 全局状态 ====================
        let allQuestions = [];
        let allCategories = [];
        let currentUser = null;
        let tempImages = []; // 编辑时暂存的图片

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            updateApiUrlDisplay();
            // 检查登录状态
            checkAuth();
            // 登录按钮事件
            document.getElementById('btnLogin').addEventListener('click', handleLogin);
            document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('loginUsername').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginPassword').focus();
            });
        });

        // ==================== 认证 ====================
        async function checkAuth() {
            if (!API_BASE_URL) {
                showLogin();
                document.getElementById('loginError').textContent = '请先配置服务器地址';
                return;
            }
            try {
                const res = await fetch(`${API_BASE_URL}/api/me`, {
                    credentials: 'include',
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.username) {
                        currentUser = data;
                        showApp();
                    } else {
                        showLogin();
                    }
                } else {
                    showLogin();
                }
            } catch (err) {
                showLogin();
                console.log('后端服务未连接:', err.message);
                document.getElementById('loginError').textContent = '无法连接服务器，请检查地址配置';
            }
        }

        function showLogin() {
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginError').textContent = '';
        }

        function showApp() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('appContainer').classList.add('active');
            document.getElementById('displayUsername').textContent = currentUser.username;
            document.getElementById('displayRole').textContent = currentUser.role === 'admin' ? '管理员' : '用户';

            // 仅管理员显示添加按钮
            const addBtn = document.getElementById('btnAddQuestion');
            if (addBtn) {
                addBtn.style.display = currentUser.role === 'admin' ? 'inline-flex' : 'none';
            }
            loadQuestions();
        }

        async function handleLogin() {
            if (!API_BASE_URL) {
                document.getElementById('loginError').textContent = '请先配置服务器地址（点击下方链接）';
                return;
            }
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '请输入账号和密码';
                return;
            }
            errorEl.textContent = '';
            const btn = document.getElementById('btnLogin');
            btn.textContent = '登录中...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok && data.username) {
                    currentUser = { username: data.username, role: data.role };
                    showApp();
                    showToast('登录成功！欢迎回来 👋', 'success');
                } else {
                    errorEl.textContent = data.error || '登录失败';
                }
            } catch (err) {
                errorEl.textContent = '无法连接服务器，请检查地址配置';
                console.error(err);
            } finally {
                btn.textContent = '登 录';
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            try {
                await fetch(`${API_BASE_URL}/api/logout`, {
                    method: 'POST',
                    credentials: 'include',
                });
            } catch (e) { /* ignore */ }
            currentUser = null;
            allQuestions = [];
            allCategories = [];
            showLogin();
            showToast('已安全退出', 'info');
        }

        // ==================== 数据加载 ====================
        async function loadQuestions() {
            if (!API_BASE_URL) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/questions`, {
                    credentials: 'include',
                });
                if (res.status === 401) {
                    handleLogout();
                    return;
                }
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                allQuestions = data.questions || [];
                allCategories = data.categories || [];
                updateCategoryFilter();
                renderQuestions();
            } catch (err) {
                console.error('加载题目失败:', err);
                showToast('加载题目失败，请检查后端连接', 'error');
            }
        }

        function updateCategoryFilter() {
            const select = document.getElementById('filterCategory');
            const currentVal = select.value;
            select.innerHTML = '<option value="">📂 全部题库</option>';
            allCategories.forEach(cat => {
                select.innerHTML +=
                    `<option value="${escapeHtml(cat)}" ${currentVal===cat?'selected':''}>📂 ${escapeHtml(cat)}</option>`;
            });
            // 更新datalist
            const datalist = document.getElementById('categorySuggestions');
            if (datalist) {
                datalist.innerHTML = allCategories.map(c => `<option value="${escapeHtml(c)}">`).join('');
            }
        }

        // ==================== 渲染题目 ====================
        function renderQuestions() {
            const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
            const category = document.getElementById('filterCategory').value;

            let filtered = allQuestions;
            if (keyword) {
                filtered = filtered.filter(q =>
                    (q.number && q.number.toLowerCase().includes(keyword)) ||
                    (q.name && q.name.toLowerCase().includes(keyword)) ||
                    (q.content && q.content.toLowerCase().includes(keyword)) ||
                    (q.code && q.code.toLowerCase().includes(keyword)) ||
                    (q.category && q.category.toLowerCase().includes(keyword))
                );
            }
            if (category) {
                filtered = filtered.filter(q => q.category === category);
            }

            // 排序：按编号或创建时间倒序
            filtered.sort((a, b) => {
                if (a.number && b.number) return a.number.localeCompare(b.number);
                return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
            });

            document.getElementById('resultCount').textContent = `共 ${filtered.length} 道题目`;
            const grid = document.getElementById('questionsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                <div class="empty-state">
                  <div class="icon">📭</div>
                  <p>${allQuestions.length===0 ? '还没有题目，点击上方按钮添加吧！' : '没有匹配的题目'}</p>
                </div>`;
                return;
            }

            const isAdmin = currentUser && currentUser.role === 'admin';

            grid.innerHTML = filtered.map(q => {
                const imagesHtml = (q.images && q.images.length > 0) ?
                    `<div class="q-images">${q.images.map(img=>`
                  <img src="${escapeHtml(img)}" alt="题目图片" 
                       onclick="openLightbox('${escapeHtml(img)}')" 
                       loading="lazy" 
                       onerror="this.style.display='none'">
                `).join('')}</div>` : '';

                const codeHtml = q.code ?
                    `<div class="code-label">💻 正确代码</div>
                <div class="q-code" style="position:relative;">
                  <button class="copy-btn" onclick="copyCode(event, '${escapeJs(q.code)}')">📋 复制</button>
                  ${escapeHtml(q.code)}
                </div>` : '';

                const contentHtml = q.content ?
                    `<div class="q-content">${escapeHtml(q.content)}</div>` : '';

                const actionsHtml = isAdmin ? `
                  <div class="card-actions">
                    <button class="btn btn-outline btn-sm" onclick="openEditModal('${q.id}')">✏️ 编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">🗑 删除</button>
                  </div>` : '';

                return `
                <div class="question-card" data-id="${q.id}">
                  <div class="card-header">
                    ${q.number ? `<span class="q-number">#${escapeHtml(q.number)}</span>` : ''}
                    ${q.category ? `<span class="q-category">📂 ${escapeHtml(q.category)}</span>` : ''}
                  </div>
                  <div class="q-name">${escapeHtml(q.name || '未命名题目')}</div>
                  ${contentHtml}
                  ${imagesHtml}
                  ${codeHtml}
                  ${actionsHtml}
                </div>`;
            }).join('');
        }

        // ==================== 添加/编辑 ====================
        function openAddModal() {
            if (currentUser.role !== 'admin') {
                showToast('仅管理员可添加题目', 'error');
                return;
            }
            document.getElementById('modalTitle').textContent = '➕ 添加题目';
            document.getElementById('editId').value = '';
            document.getElementById('qNumber').value = '';
            document.getElementById('qName').value = '';
            document.getElementById('qCategory').value = '';
            document.getElementById('qContent').value = '';
            document.getElementById('qCode').value = '';
            document.getElementById('imageUrlInput').value = '';
            document.getElementById('imageFileInput').value = '';
            tempImages = [];
            renderImagePreviews();
            updateCharCounts();
            document.getElementById('questionModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            document.getElementById('qNumber').focus();
            const datalist = document.getElementById('categorySuggestions');
            if (datalist) datalist.innerHTML = allCategories.map(c => `<option value="${escapeHtml(c)}">`).join('');
        }

        function openEditModal(id) {
            const q = allQuestions.find(q => q.id === id);
            if (!q) {
                showToast('题目不存在', 'error');
                return;
            }
            document.getElementById('modalTitle').textContent = '✏️ 编辑题目';
            document.getElementById('editId').value = q.id;
            document.getElementById('qNumber').value = q.number || '';
            document.getElementById('qName').value = q.name || '';
            document.getElementById('qCategory').value = q.category || '';
            document.getElementById('qContent').value = q.content || '';
            document.getElementById('qCode').value = q.code || '';
            document.getElementById('imageUrlInput').value = '';
            document.getElementById('imageFileInput').value = '';
            tempImages = [...(q.images || [])];
            renderImagePreviews();
            updateCharCounts();
            document.getElementById('questionModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const datalist = document.getElementById('categorySuggestions');
            if (datalist) datalist.innerHTML = allCategories.map(c => `<option value="${escapeHtml(c)}">`).join('');
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            document.body.style.overflow = '';
            tempImages = [];
        }

        async function saveQuestion() {
            const editId = document.getElementById('editId').value;
            const number = document.getElementById('qNumber').value.trim();
            const name = document.getElementById('qName').value.trim();
            const category = document.getElementById('qCategory').value.trim();
            const content = document.getElementById('qContent').value.trim();
            const code = document.getElementById('qCode').value.trim();

            if (!number) { showToast('请输入题目编号', 'error');
                document.getElementById('qNumber').focus(); return; }
            if (!name) { showToast('请输入题目名称', 'error');
                document.getElementById('qName').focus(); return; }

            const questionData = {
                number,
                name,
                category,
                content,
                code,
                images: [...tempImages],
            };

            const btnSave = document.getElementById('btnSave');
            btnSave.textContent = '保存中...';
            btnSave.disabled = true;

            try {
                let res;
                if (editId) {
                    res = await fetch(`${API_BASE_URL}/api/questions/${encodeURIComponent(editId)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(questionData),
                    });
                } else {
                    res = await fetch(`${API_BASE_URL}/api/questions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(questionData),
                    });
                }
                if (res.status === 401) { handleLogout(); return; }
                const data = await res.json();
                if (res.ok && (data.success || data.question)) {
                    closeModal();
                    await loadQuestions();
                    showToast(editId ? '题目已更新 ✅' : '题目已添加 ✅', 'success');
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch (err) {
                console.error('保存失败:', err);
                showToast('保存失败，请检查网络连接', 'error');
            } finally {
                btnSave.textContent = '💾 保存';
                btnSave.disabled = false;
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('确定要删除这道题目吗？此操作不可恢复！')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/questions/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    credentials: 'include',
                });
                if (res.status === 401) { handleLogout(); return; }
                const data = await res.json();
                if (res.ok && data.success) {
                    await loadQuestions();
                    showToast('题目已删除 🗑', 'info');
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (err) {
                console.error('删除失败:', err);
                showToast('删除失败，请检查网络连接', 'error');
            }
        }

        // ==================== 图片处理 ====================
        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    showToast(`${file.name} 不是图片文件`, 'error');
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`${file.name} 超过10MB限制`, 'error');
                    return;
                }
                compressAndAddImage(file);
            });
            event.target.value = '';
        }

        function compressAndAddImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 800;
                    if (width > maxWidth) {
                        height = Math.round(height * (maxWidth / width));
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    tempImages.push(base64);
                    renderImagePreviews();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addImageUrl() {
            const url = document.getElementById('imageUrlInput').value.trim();
            if (!url) return;
            if (!url.match(/^https?:\/\/.+/i) && !url.match(/^data:image\//)) {
                showToast('请输入有效的图片URL（http/https开头）或base64数据', 'error');
                return;
            }
            tempImages.push(url);
            document.getElementById('imageUrlInput').value = '';
            renderImagePreviews();
        }

        function removeTempImage(index) {
            tempImages.splice(index, 1);
            renderImagePreviews();
        }

        function renderImagePreviews() {
            const area = document.getElementById('imagePreviewArea');
            if (!area) return;
            if (tempImages.length === 0) {
                area.innerHTML = '<span style="font-size:12px;color:#999;">暂无图片</span>';
                return;
            }
            area.innerHTML = tempImages.map((img, i) => `
            <div class="preview-item">
              <img src="${escapeHtml(img)}" alt="预览${i+1}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text x=%2230%22 y=%2255%22 font-size=%2212%22 fill=%22%23999%22>加载失败</text></svg>'">
              <button class="remove-img" onclick="removeTempImage(${i})" title="移除">×</button>
            </div>
          `).join('');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = '';
        }

        function copyCode(event, code) {
            event.stopPropagation();
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            }).catch(() => {
                showToast('复制失败，请手动选择代码', 'error');
            });
        }

        // ==================== 字符计数 ====================
        function updateCharCounts() {
            const content = document.getElementById('qContent').value;
            const code = document.getElementById('qCode').value;
            document.getElementById('contentCharCount').textContent = content.length + ' 字';
            document.getElementById('codeCharCount').textContent = code.length + ' 字';
        }
        document.getElementById('qContent').addEventListener('input', updateCharCounts);
        document.getElementById('qCode').addEventListener('input', updateCharCounts);

        // ==================== Toast ====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ==================== 工具函数 ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(
                /\r/g, '\\r');
        }

        // ==================== 键盘快捷键 ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('lightbox').style.display === 'flex') {
                    closeLightbox();
                } else if (document.getElementById('questionModal').style.display === 'block') {
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
